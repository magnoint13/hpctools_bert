[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["train_lightning", "eval_model", "token_model"]

[project]
name = "bert-dist-training"
version = "0.1.0"
requires-python = ">=3.10,<3.11"

dependencies = [
    "torch==2.8.0",
    "transformers",
    "datasets",
    "lightning",
    "jsonargparse[signatures]", # LightningCLI
    "tensorboard",
]

